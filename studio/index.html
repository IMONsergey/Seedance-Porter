<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seedance Porter Studio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">SEEDANCE PORTER · BOS-2026-07-17</p>
        <h1>Production Studio</h1>
        <p class="sub">Validate against the official ByteDance/BytePlus guide. Compile second. Spend credits only after the hard gate passes.</p>
      </div>
      <div class="status" id="health">checking…</div>
    </header>

    <section class="toolbar panel">
      <label>Provider
        <select id="provider">
          <option value="byteplus">BytePlus</option>
          <option value="fal">fal.ai</option>
          <option value="muapi">MuAPI / 2.5 preview</option>
        </select>
      </label>
      <label>Studio API token
        <input id="token" type="password" autocomplete="off" placeholder="optional" />
      </label>
      <button type="button" onclick="window.location.href='/library.html'">Prompt Digest</button>
      <button id="example">Load example</button>
      <button id="models">Models</button>
      <button id="validate">Validate Official</button>
      <button id="compile" class="primary">Compile</button>
      <button id="generate" class="danger">Generate</button>
    </section>

    <section class="grid">
      <div class="panel editor-panel">
        <div class="panel-title">Project JSON</div>
        <textarea id="project" spellcheck="false"></textarea>
      </div>
      <div class="panel result-panel">
        <div class="panel-title">Result / Official Compliance</div>
        <pre id="result">Ready.</pre>
        <video id="video" controls playsinline hidden></video>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
