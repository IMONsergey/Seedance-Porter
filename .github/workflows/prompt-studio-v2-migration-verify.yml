name: Prompt Studio v2 migration verifier

on:
  push:
    branches: [feat/prompt-studio-v2-rule-packs]
    paths:
      - 'scripts/verify-prompt-studio-v2-migration-state.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v2-rule-packs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-prompt-studio-v2-migration-state.mjs
      - run: node scripts/validate-prompt-studio-v2-rule-packs.mjs
      - name: Mark verified branch state
        run: |
          echo 'verified' > .prompt-studio-v2-migration-ok
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add .prompt-studio-v2-migration-ok
          git commit -m 'chore: verify Prompt Studio v2 migration state' || exit 0
          git push origin HEAD:feat/prompt-studio-v2-rule-packs
