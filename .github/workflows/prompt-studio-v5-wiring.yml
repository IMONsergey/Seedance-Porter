name: Prompt Studio v5 wiring finalizer

on:
  pull_request:
    paths:
      - 'scripts/apply-prompt-studio-v5-wiring.mjs'
      - '.github/workflows/prompt-studio-v5-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v5-repair-blueprints-seedance-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply exact v5 production wiring
        run: node scripts/apply-prompt-studio-v5-wiring.mjs
      - name: Validate v5 engines
        run: node scripts/validate-prompt-studio-v5-engines.mjs
      - name: Validate v5 staged workflow guard
        run: node scripts/validate-prompt-studio-v5-workflow-guard.mjs
      - name: Validate v5 production wiring
        run: node scripts/validate-prompt-studio-v5-production.mjs
      - name: Validate Pages module graph
        run: node scripts/validate-pages-contract.mjs
      - name: Validate protected exact-100 render
        run: npm run validate:render
      - name: Remove one-shot wiring scaffolding and commit final product state
        run: |
          git rm scripts/apply-prompt-studio-v5-wiring.mjs .github/workflows/prompt-studio-v5-wiring.yml
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add studio/sidebar.js .github/workflows/pages.yml scripts/validate-pages-contract.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire Prompt Studio v5 into production shell and Pages'
          git push origin HEAD:feat/prompt-studio-v5-repair-blueprints-seedance-adapter
