name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Validate official Seedance project standard
        run: npm run porter -- validate examples/product-film.json
      - name: Validate attributed prompt digest and Porter Originals
        run: node scripts/validate-library.mjs
      - name: Validate multi-platform source universe
        run: node scripts/validate-source-universe.mjs
      - name: Validate prompt library browser DOM contract
        run: node scripts/validate-ui-contract.mjs
      - name: Validate bilingual UI and source iframe coverage
        run: node scripts/validate-experience.mjs
      - name: Validate isolated bilingual Research Corpus UI
        run: node scripts/validate-corpus-ui.mjs
      - name: Validate rendered 100-card browser contract
        run: npm run validate:render
      - name: Syntax-check research corpus scripts
        run: |
          node --check scripts/import-case-candidates.mjs
          node --check scripts/augment-case-candidates.mjs
          node --check scripts/refresh-case-corpus.mjs
          node --check scripts/build-case-review-queue.mjs
          node --check scripts/validate-corpus-ui.mjs
      - name: Syntax-check browser modules
        run: |
          node --check studio/i18n.js
          node --check studio/media-embed.js
          node --check studio/experience.js
          node --check studio/experience-stability.js
          node --check studio/case-locales.js
          node --check studio/case-translation-runtime.js
          node --check studio/source-universe.js
          node --check studio/multi-source-cases.js
          node --check studio/multi-source-cases-batch2.js
          node --check studio/multi-source-cases-batch3.js
          node --check studio/multi-source-cases-batch4.js
          node --check studio/multi-source-cases-batch5.js
          node --check studio/multi-source-index.js
          node --check studio/multi-source-batch-runtime.js
          node --check studio/unified-curated-ui.js
          node --check studio/multi-source-polish.js
          node --check studio/coverage-audit.js
          node --check studio/case-corpus-ui.js
          node --check studio/sidebar.js
