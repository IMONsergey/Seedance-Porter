name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Validate official Seedance project standard
        run: npm run porter -- validate examples/product-film.json
      - name: Validate attributed prompt digest and Porter Originals
        run: node scripts/validate-library.mjs
      - name: Validate multi-platform source universe
        run: node scripts/validate-source-universe.mjs
      - name: Validate prompt library browser DOM contract
        run: node scripts/validate-ui-contract.mjs
      - name: Validate bilingual UI and source iframe coverage
        run: node scripts/validate-experience.mjs
      - name: Validate isolated bilingual Research Corpus UI
        run: node scripts/validate-corpus-ui.mjs
      - name: Validate evidence-aware Case Intelligence
        run: node scripts/validate-case-intelligence-evidence.mjs
      - name: Validate Deep Review Workspace
        run: node scripts/validate-deep-review-workspace.mjs
      - name: Validate Deep Review Player evidence boundary
        run: node scripts/validate-review-player.mjs
      - name: Validate Promotion Workspace
        run: node scripts/validate-promotion-workspace.mjs
      - name: Validate strategic Coverage Planner and review queue
        run: node scripts/validate-coverage-planner.mjs
      - name: Validate source adapter registry, risk policy and health intelligence
        run: node scripts/validate-source-adapters.mjs
      - name: Validate GitHub Pages production artifact
        run: node scripts/validate-pages-contract.mjs
      - name: Validate rendered 100-card browser contract
        run: npm run validate:render
      - name: Syntax-check research operations scripts
        run: |
          node --check scripts/import-case-candidates.mjs
          node --check scripts/augment-case-candidates.mjs
          node --check scripts/expand-case-candidates.mjs
          node --check scripts/source-adapter-registry.mjs
          node --check scripts/research-risk-policy.mjs
          node --check scripts/source-health-engine.mjs
          node --check scripts/build-source-health.mjs
          node --check scripts/refresh-case-corpus.mjs
          node --check scripts/build-case-review-queue.mjs
          node --check scripts/build-coverage-plan.mjs
          node --check scripts/build-curation-draft.mjs
          node --check scripts/validate-corpus-ui.mjs
          node --check scripts/validate-case-intelligence-evidence.mjs
          node --check scripts/validate-deep-review-workspace.mjs
          node --check scripts/validate-review-player.mjs
          node --check scripts/validate-promotion-workspace.mjs
          node --check scripts/validate-coverage-planner.mjs
          node --check scripts/validate-source-adapters.mjs
          node --check scripts/validate-pages-contract.mjs
      - name: Syntax-check browser modules
        run: |
          node --check studio/workspace-router.js
          node --check studio/i18n.js
          node --check studio/media-embed.js
          node --check studio/experience.js
          node --check studio/experience-stability.js
          node --check studio/case-locales.js
          node --check studio/case-translation-runtime.js
          node --check studio/case-analysis-curated.js
          node --check studio/case-intelligence.js
          node --check studio/case-intelligence-runtime.js
          node --check studio/case-intelligence-locales.js
          node --check studio/case-ui.js
          node --check studio/source-universe.js
          node --check studio/multi-source-cases.js
          node --check studio/multi-source-cases-batch2.js
          node --check studio/multi-source-cases-batch3.js
          node --check studio/multi-source-cases-batch4.js
          node --check studio/multi-source-cases-batch5.js
          node --check studio/multi-source-index.js
          node --check studio/multi-source-batch-runtime.js
          node --check studio/unified-curated-ui.js
          node --check studio/multi-source-polish.js
          node --check studio/coverage-audit.js
          node --check studio/coverage-planner-bootstrap.js
          node --check studio/coverage-planner-engine.js
          node --check studio/coverage-planner-ui.js
          node --check studio/source-health-bootstrap.js
          node --check studio/source-health-ui.js
          node --check studio/case-corpus-ui.js
          node --check studio/deep-review-bootstrap.js
          node --check studio/deep-review-ui.js
          node --check studio/deep-review-player-bootstrap.js
          node --check studio/deep-review-player.js
          node --check studio/promotion-bootstrap.js
          node --check studio/promotion-engine.js
          node --check studio/promotion-ui.js
          node --check studio/sidebar.js
