name: Prompt Studio v5 final product finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/prompt-studio-v5-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v5-repair-blueprints-seedance-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply v5 wiring and semantic hardening idempotently
        shell: bash
        run: |
          if [[ -f scripts/apply-prompt-studio-v5-wiring.mjs ]]; then node scripts/apply-prompt-studio-v5-wiring.mjs; fi
          if [[ -f scripts/apply-prompt-studio-v5-hardening.mjs ]]; then node scripts/apply-prompt-studio-v5-hardening.mjs; fi
      - name: Validate v1–v5 contracts
        run: |
          node scripts/validate-prompt-studio.mjs
          node scripts/validate-prompt-studio-v2-rule-packs.mjs
          node scripts/validate-prompt-studio-v3-persistence.mjs
          node scripts/validate-prompt-studio-v4-engines.mjs
          node scripts/validate-prompt-studio-v4-workflow-guard.mjs
          node scripts/validate-prompt-studio-v5-engines.mjs
          node scripts/validate-prompt-studio-v5-workflow-guard.mjs
          node scripts/validate-prompt-studio-v5-production.mjs
          node scripts/validate-pages-contract.mjs
          npm run validate:render
      - name: Remove all v5 finalizer scaffolding and commit clean release candidate
        run: |
          rm -f scripts/apply-prompt-studio-v5-wiring.mjs
          rm -f scripts/apply-prompt-studio-v5-hardening.mjs
          rm -f .github/workflows/prompt-studio-v5-wiring.yml
          rm -f .github/workflows/prompt-studio-v5-hardening.yml
          rm -f .github/workflows/prompt-studio-v5-finalize.yml
          git add -A
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: finalize Prompt Studio v5 production intelligence and Seedance export'
          git push origin HEAD:feat/prompt-studio-v5-repair-blueprints-seedance-adapter
