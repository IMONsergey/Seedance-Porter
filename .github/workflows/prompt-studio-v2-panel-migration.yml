name: Prompt Studio v2 panel migration

on:
  push:
    branches: [feat/prompt-studio-v2-rule-packs]
    paths:
      - 'scripts/apply-prompt-studio-v2-panel-migration.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v2-rule-packs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-prompt-studio-v2-panel-migration.mjs
      - run: node --check studio/prompt-studio-profile-panel.js
      - name: Commit idempotence fix
        run: |
          if git diff --quiet -- studio/prompt-studio-profile-panel.js; then exit 0; fi
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add studio/prompt-studio-profile-panel.js
          git commit -m 'fix: make Rule Pack panel rendering idempotent'
          git push origin HEAD:feat/prompt-studio-v2-rule-packs
