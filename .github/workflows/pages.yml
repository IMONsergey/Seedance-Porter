name: Deploy Prompt Digest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'schemas/case-review.schema.json'
      - 'schemas/curation-draft.schema.json'
      - 'scripts/import-case-candidates.mjs'
      - 'scripts/augment-case-candidates.mjs'
      - 'scripts/refresh-case-corpus.mjs'
      - 'scripts/build-case-review-queue.mjs'
      - 'scripts/build-coverage-plan.mjs'
      - 'scripts/build-curation-draft.mjs'
      - 'scripts/validate-pages-contract.mjs'
      - 'scripts/validate-deep-review-workspace.mjs'
      - 'scripts/validate-promotion-workspace.mjs'
      - 'scripts/validate-coverage-planner.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# GitHub Pages is enabled with Source = GitHub Actions.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Pages production artifact contract
        run: node scripts/validate-pages-contract.mjs

      - name: Validate Deep Review Workspace contract
        run: node scripts/validate-deep-review-workspace.mjs

      - name: Validate Promotion Workspace contract
        run: node scripts/validate-promotion-workspace.mjs

      - name: Validate strategic Coverage Planner contract
        run: node scripts/validate-coverage-planner.mjs

      - name: Build Research Corpus + strategic snapshots for Pages
        continue-on-error: true
        run: npm run case:refresh

      - name: Prepare static Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp studio/library.html _site/index.html
          cp studio/library.css _site/library.css
          cp studio/digest.css _site/digest.css
          cp studio/case-intelligence.css _site/case-intelligence.css
          cp studio/case-corpus.css _site/case-corpus.css
          cp studio/deep-review.css _site/deep-review.css
          cp studio/promotion.css _site/promotion.css
          cp studio/coverage-planner.css _site/coverage-planner.css
          cp studio/experience.css _site/experience.css
          cp studio/multi-source.css _site/multi-source.css
          cp studio/coverage-audit.css _site/coverage-audit.css
          cp studio/library.js _site/library.js
          cp studio/sidebar.js _site/sidebar.js
          cp studio/workspace-router.js _site/workspace-router.js
          cp studio/case-ui.js _site/case-ui.js
          cp studio/case-corpus-ui.js _site/case-corpus-ui.js
          cp studio/deep-review-bootstrap.js _site/deep-review-bootstrap.js
          cp studio/deep-review-ui.js _site/deep-review-ui.js
          cp studio/promotion-bootstrap.js _site/promotion-bootstrap.js
          cp studio/promotion-engine.js _site/promotion-engine.js
          cp studio/promotion-ui.js _site/promotion-ui.js
          cp studio/coverage-planner-bootstrap.js _site/coverage-planner-bootstrap.js
          cp studio/coverage-planner-engine.js _site/coverage-planner-engine.js
          cp studio/coverage-planner-ui.js _site/coverage-planner-ui.js
          cp studio/case-intelligence.js _site/case-intelligence.js
          cp studio/case-intelligence-runtime.js _site/case-intelligence-runtime.js
          cp studio/case-analysis-curated.js _site/case-analysis-curated.js
          cp studio/case-intelligence-locales.js _site/case-intelligence-locales.js
          cp studio/case-locales.js _site/case-locales.js
          cp studio/case-translation-runtime.js _site/case-translation-runtime.js
          cp studio/experience.js _site/experience.js
          cp studio/experience-stability.js _site/experience-stability.js
          cp studio/i18n.js _site/i18n.js
          cp studio/media-embed.js _site/media-embed.js
          cp studio/source-universe.js _site/source-universe.js
          cp studio/multi-source-cases.js _site/multi-source-cases.js
          cp studio/multi-source-cases-batch2.js _site/multi-source-cases-batch2.js
          cp studio/multi-source-cases-batch3.js _site/multi-source-cases-batch3.js
          cp studio/multi-source-cases-batch4.js _site/multi-source-cases-batch4.js
          cp studio/multi-source-cases-batch5.js _site/multi-source-cases-batch5.js
          cp studio/multi-source-index.js _site/multi-source-index.js
          cp studio/multi-source-batch-runtime.js _site/multi-source-batch-runtime.js
          cp studio/unified-curated-ui.js _site/unified-curated-ui.js
          cp studio/multi-source-polish.js _site/multi-source-polish.js
          cp studio/coverage-audit.js _site/coverage-audit.js
          cp studio/library-data.js _site/library-data.js
          cp studio/digest-data.js _site/digest-data.js

          # Research/planning snapshots are generated in the Pages workspace. If an
          # upstream source is temporarily unavailable, deploy the curated app anyway
          # and let research workspaces expose explicit pending/partial states.
          if [[ -f studio/case-candidates.json ]]; then
            cp studio/case-candidates.json _site/case-candidates.json
          fi
          if [[ -f studio/case-review-queue.json ]]; then
            cp studio/case-review-queue.json _site/case-review-queue.json
          fi
          if [[ -f studio/coverage-plan.json ]]; then
            cp studio/coverage-plan.json _site/coverage-plan.json
          fi

          touch _site/.nojekyll

          # Project Pages is hosted under /Seedance-Porter/, so root-relative
          # asset URLs used by the local Studio need to become relative here.
          sed -i 's|href="/library.css"|href="./library.css"|g' _site/index.html
          sed -i 's|href="/digest.css"|href="./digest.css"|g' _site/index.html
          sed -i 's|href="/case-intelligence.css"|href="./case-intelligence.css"|g' _site/index.html
          sed -i 's|href="/case-corpus.css"|href="./case-corpus.css"|g' _site/index.html
          sed -i 's|src="/library.js"|src="./library.js"|g' _site/index.html
          sed -i 's|src="/sidebar.js"|src="./sidebar.js"|g' _site/index.html
          sed -i 's|src="/case-ui.js"|src="./case-ui.js"|g' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
