name: Prompt Studio v9 Pages Preflight

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'schemas/prompt-studio-generation*.json'
      - 'scripts/validate-prompt-studio-v9-*.mjs'
      - 'scripts/validate-pages-contract.mjs'
      - 'docs/PROJECT-MEMORY*'
      - 'docs/PROMPT-STUDIO-V9-*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/prompt-studio-v9-pages-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'schemas/prompt-studio-generation*.json'
      - 'scripts/validate-prompt-studio-v9-*.mjs'
      - 'scripts/validate-pages-contract.mjs'
      - 'docs/PROJECT-MEMORY*'
      - 'docs/PROMPT-STUDIO-V9-*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/prompt-studio-v9-pages-preflight.yml'
  workflow_dispatch:

jobs:
  pages-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate V9 evaluation engine
        run: node scripts/validate-prompt-studio-v9-evaluation.mjs
      - name: Validate V9 Generation Console and staged-work guards
        run: node scripts/validate-prompt-studio-v9-console-ui.mjs
      - name: Validate V9 production/project memory
        run: node scripts/validate-prompt-studio-v9-production.mjs
      - name: Validate generalized Pages browser graph
        run: node scripts/validate-pages-contract.mjs
      - name: Validate exact-100 rendered runtime
        run: npm run validate:render
      - name: Assert V9 top-level browser assets exist
        run: |
          test -f studio/prompt-studio-v9-bootstrap.js
          test -f studio/prompt-studio-v9-workflow-guard.js
          test -f studio/prompt-studio-v9-console-ui.js
          test -f studio/prompt-studio-generation-evaluation.js
          test -f studio/prompt-studio-v9.css
