name: Prompt Studio v9 Release CI

on:
  pull_request:
    paths:
      - 'studio/prompt-studio-*.js'
      - 'studio/prompt-studio*.css'
      - 'studio/sidebar.js'
      - 'schemas/prompt-studio-generation*.json'
      - 'scripts/validate-prompt-studio-v7-*.mjs'
      - 'scripts/validate-prompt-studio-v8-*.mjs'
      - 'scripts/validate-prompt-studio-v9-*.mjs'
      - 'scripts/validate-pages-contract.mjs'
      - 'docs/PROJECT-MEMORY*'
      - 'docs/PROMPT-STUDIO-V9-*.md'
      - 'docs/ADR-017-*.md'
      - 'docs/ADR-018-*.md'
      - '.github/workflows/prompt-studio-v9-release-ci.yml'
  push:
    branches: [main]
    paths:
      - 'studio/prompt-studio-*.js'
      - 'studio/prompt-studio*.css'
      - 'studio/sidebar.js'
      - 'schemas/prompt-studio-generation*.json'
      - 'scripts/validate-prompt-studio-v9-*.mjs'
      - 'scripts/validate-pages-contract.mjs'
      - 'docs/PROJECT-MEMORY*'
      - 'docs/PROMPT-STUDIO-V9-*.md'
      - 'docs/ADR-017-*.md'
      - 'docs/ADR-018-*.md'
      - '.github/workflows/prompt-studio-v9-release-ci.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20,22,24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Validate V4 Variant baseline
        run: node scripts/validate-prompt-studio-v4-engines.mjs
      - name: Validate V7 returned-result baseline
        run: node scripts/validate-prompt-studio-v7-generation-results.mjs
      - name: Validate V8 batch lineage baseline
        run: node scripts/validate-prompt-studio-v8-batch.mjs
      - name: Validate V9 evaluation engine
        run: node scripts/validate-prompt-studio-v9-evaluation.mjs
      - name: Validate V9 decision-lineage audit
        run: node scripts/validate-prompt-studio-v9-decision-audit.mjs
      - name: Validate final render-safe V9 Console UI
        run: node scripts/validate-prompt-studio-v9-console.mjs
      - name: Validate V9 production/project-memory contract
        run: node scripts/validate-prompt-studio-v9-production.mjs
      - name: Validate Pages browser module graph
        run: node scripts/validate-pages-contract.mjs
      - name: Validate exact-100 runtime renderer
        run: npm run validate:render
      - name: Parse V9 schema and machine state
        run: |
          node -e "JSON.parse(require('fs').readFileSync('schemas/prompt-studio-generation-evaluation.schema.json','utf8')); JSON.parse(require('fs').readFileSync('docs/PROJECT-MEMORY.json','utf8')); JSON.parse(require('fs').readFileSync('docs/PROMPT-STUDIO-V9-STATE.json','utf8')); console.log('json-ok')"
      - name: Syntax-check final V9 release surface
        run: |
          node --check studio/prompt-studio-generation-evaluation.js
          node --check studio/prompt-studio-generation-evaluation-audit.js
          node --check studio/prompt-studio-v9-workflow-guard.js
          node --check studio/prompt-studio-v9-console-ui.js
          node --check studio/prompt-studio-v9-bootstrap.js
          node --check studio/sidebar.js
          node --check scripts/validate-prompt-studio-v9-evaluation.mjs
          node --check scripts/validate-prompt-studio-v9-decision-audit.mjs
          node --check scripts/validate-prompt-studio-v9-console.mjs
          node --check scripts/validate-prompt-studio-v9-production.mjs
