name: Prompt Studio v3 engine exact fix

on:
  pull_request:
    paths:
      - 'scripts/apply-prompt-studio-v3-engine-fix.mjs'
      - '.github/workflows/prompt-studio-v3-engine-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v3-timeline-ingredients
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-prompt-studio-v3-engine-fix.mjs
      - run: node --check studio/prompt-studio-engine.js
      - run: node scripts/validate-prompt-studio.mjs
      - run: node scripts/validate-prompt-studio-regressions.mjs
      - name: Commit exact engine fix
        run: |
          if git diff --quiet -- studio/prompt-studio-engine.js scripts/validate-prompt-studio-regressions.mjs; then exit 0; fi
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add studio/prompt-studio-engine.js scripts/validate-prompt-studio-regressions.mjs
          git commit -m 'fix: preserve Prompt Studio legacy migration and patch audit diff'
          git push origin HEAD:feat/prompt-studio-v3-timeline-ingredients
