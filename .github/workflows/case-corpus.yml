name: Refresh Case Intelligence Corpus

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Candidate corpus size (500-1000)'
        required: false
        default: '750'
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/import-case-candidates.mjs'
      - 'scripts/build-case-review-queue.mjs'
      - 'studio/case-intelligence.js'
      - 'studio/case-intelligence-runtime.js'
      - '.github/workflows/case-corpus.yml'

permissions:
  contents: write

concurrency:
  group: case-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Import balanced research candidates
        continue-on-error: true
        env:
          CORPUS_LIMIT: ${{ inputs.limit || '750' }}
        run: node scripts/import-case-candidates.mjs --limit "$CORPUS_LIMIT" --min 500 --output studio/case-candidates.json

      - name: Build deep-review queue
        run: node scripts/build-case-review-queue.mjs --input studio/case-candidates.json --limit 90 --output studio/case-review-queue.json

      - name: Verify and report corpus progress
        run: |
          node --input-type=module - <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          const corpus = JSON.parse(await readFile('studio/case-candidates.json', 'utf8'));
          const queue = JSON.parse(await readFile('studio/case-review-queue.json', 'utf8'));
          const candidates = corpus.stats?.candidates || 0;
          const queueSize = queue.stats?.queue || 0;
          const target = corpus.target?.min || 500;
          if (queueSize < 10) throw new Error('Deep-review queue was not populated.');
          if (candidates < target) {
            console.warn(`[case-corpus] PARTIAL SNAPSHOT: ${candidates}/${target} candidates after dedupe/risk filtering. Keep expanding discovery adapters; do not present this as a completed 500+ corpus.`);
          }
          const summary = [
            '## Research Corpus refresh',
            '',
            `- Candidates: **${candidates} / ${target} minimum target**`,
            `- Target reached: **${candidates >= target ? 'yes' : 'no — partial snapshot published'}**`,
            `- Deep-review queue: **${queueSize}**`,
            `- Source pools responding: **${(corpus.sourceStats || []).filter(item => item.ok).length}/${(corpus.sourceStats || []).length}**`,
            '',
            candidates < target ? '> Partial data is intentionally committed so the Research Corpus UI remains useful while discovery coverage is expanded.' : '> Minimum corpus target reached.'
          ].join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(JSON.stringify({ target, targetReached: candidates >= target, corpus: corpus.stats, queue: queue.stats }, null, 2));
          NODE

      - name: Commit refreshed snapshots
        run: |
          if git diff --quiet -- studio/case-candidates.json studio/case-review-queue.json; then
            echo 'Corpus snapshot unchanged.'
            exit 0
          fi
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add studio/case-candidates.json studio/case-review-queue.json
          git commit -m 'data: refresh Case Intelligence corpus'
          git push origin HEAD:main
