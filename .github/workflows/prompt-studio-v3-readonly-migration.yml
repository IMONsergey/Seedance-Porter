name: Prompt Studio v3 immutable variable keys

on:
  push:
    branches: [feat/prompt-studio-v3-timeline-ingredients]
    paths:
      - 'scripts/apply-prompt-studio-v3-readonly.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-studio-v3-timeline-ingredients
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-prompt-studio-v3-readonly.mjs
      - run: node --check studio/prompt-studio-production-tools.js
      - run: node scripts/validate-prompt-studio-v3-production.mjs
      - name: Commit product fix
        run: |
          if git diff --quiet -- studio/prompt-studio-production-tools.js; then exit 0; fi
          git config user.name 'seedance-porter-bot'
          git config user.email 'seedance-porter-bot@users.noreply.github.com'
          git add studio/prompt-studio-production-tools.js
          git commit -m 'fix: make Prompt Studio variable keys immutable'
          git push origin HEAD:feat/prompt-studio-v3-timeline-ingredients
